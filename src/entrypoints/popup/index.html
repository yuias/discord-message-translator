<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Message Translator</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="w-[28rem] max-h-[560px] overflow-y-auto p-4">
  <div class="space-y-3">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-bold" data-i18n="popup_title">Discord Translator</h1>
      <input type="checkbox" id="autoTranslate" class="toggle toggle-primary toggle-sm" checked />
    </div>

    <div class="space-y-3">
      <!-- Target Language -->
      <div class="flex flex-col w-full">
        <label class="label py-1">
          <span class="text-sm" data-i18n="popup_targetLanguage">Target Language</span>
        </label>
        <select id="targetLanguage" class="select select-sm w-full"></select>
      </div>

      <!-- Translation Mode -->
      <div class="flex flex-col w-full">
        <label class="label py-1">
          <span class="text-sm" data-i18n="popup_translationMode">Translation Mode</span>
        </label>
        <select id="translationMode" class="select select-sm w-full">
          <option value="replace" data-i18n="common_modeReplace">Replace Original</option>
          <option value="append" data-i18n="popup_modeAppend">Show Both</option>
        </select>
      </div>

      <!-- Open Options -->
      <button id="openOptions" class="btn btn-sm w-full" data-i18n="popup_openOptions">Open settings</button>
    </div>

    <!-- Status Message -->
    <div id="toast" class="toast toast-top toast-end z-50">
      <div id="toastAlert" class="alert alert-success shadow-lg hidden py-2 px-3">
        <span id="toastText" class="text-sm"></span>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
